name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check public data URLs
        run: |
          if [ -z "${VITE_TIMELINE_DATA_URL}" ]; then
            echo "::error::Set repository variable VITE_TIMELINE_DATA_URL to the Supabase public latest.json URL."
            exit 1
          fi
          if [ -z "${VITE_REALISASI_DATA_URL}" ]; then
            echo "::error::Set repository variable VITE_REALISASI_DATA_URL to the Supabase public realisasi/latest.json URL."
            exit 1
          fi
        env:
          VITE_TIMELINE_DATA_URL: ${{ vars.VITE_TIMELINE_DATA_URL }}
          VITE_REALISASI_DATA_URL: ${{ vars.VITE_REALISASI_DATA_URL }}

      - name: Build
        run: npm run build
        env:
          VITE_TIMELINE_DATA_URL: ${{ vars.VITE_TIMELINE_DATA_URL }}
          VITE_REALISASI_DATA_URL: ${{ vars.VITE_REALISASI_DATA_URL }}
          VITE_BASE_PATH: /timeline-generator/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
